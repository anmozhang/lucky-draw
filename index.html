<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸运大抽奖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Sora:wght@600;800&display=swap">
<style>
/* Layout: one dark vault stage — a horizontal reel of brushed-metal prize cards under a center pointer; prize-pool editor and history below. Single deliberate dark look. */
:root{
  color-scheme:dark;
  --bg:#120922; --bg2:#22123d; --panel:#1a0f2f; --line:#2e1c4b; --line2:#46306b;
  --fg:#f1ecf8; --muted:#a898c4; --dim:#7a6a9c;
  --lime:#c8f56a; --lime-ink:#0b1d05;
  --r-common:#b9c2c2; --r-rare:#5fb6ff; --r-epic:#b88bff; --r-legend:#ffc54d; --r-mythic:#c8f56a;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Sora","Noto Sans SC",system-ui,sans-serif;
  --cw:118px; --ch:158px; --gap:clamp(26px,7vw,120px);
}
@media (max-width:600px){:root{--cw:94px;--ch:126px}}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 500px at 50% 0%,var(--bg2),var(--bg) 70%) fixed,var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:18px 48px;min-height:100%}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.06em}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-weight:700;font-variant-numeric:tabular-nums;background:transparent;color:var(--fg);font-family:inherit;font-size:14px}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--muted)}
.gem{width:12px;height:12px;background:var(--lime);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 10px var(--lime)}

/* Stage */
.stage{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,.15));padding-block:34px 28px;display:flex;flex-direction:column;align-items:center;gap:26px;overflow:hidden;position:relative}
.reel{position:relative;width:100%;height:calc(var(--ch) + 92px);overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.track{position:absolute;left:0;top:26px;display:flex;gap:var(--gap);will-change:transform}
.ptr{position:absolute;left:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.ptr.t{top:4px;border-top:13px solid #fff}
.ptr.b{top:calc(var(--ch) + 34px);border-bottom:13px solid #fff}
.ptr-line{position:absolute;left:50%;top:22px;height:calc(var(--ch) + 10px);width:1px;background:linear-gradient(transparent,rgba(255,255,255,.25),transparent);z-index:2}

.item{flex:0 0 var(--cw);display:flex;flex-direction:column;align-items:center;gap:12px}
.item .label{font-size:14px;font-weight:700;line-height:1.3;color:var(--fg);width:calc(var(--cw) + var(--gap) - 12px);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Brushed metal card — purple #A855F7 */
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:9px;overflow:hidden;color:#fff;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,rgba(0,0,0,.04) 1px 3px),
    linear-gradient(140deg,#c99bfb 0%,#A855F7 30%,#bf85fa 50%,#8b3fe0 76%,#b277f9 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.45);
  transition:transform .15s ease,box-shadow .2s ease}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.card .tint{display:none}
.card .mark{position:absolute;left:8px;top:7px;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid rgba(255,255,255,.85);border-radius:1px}
.card .ico{position:absolute;right:8px;top:14px;width:60%;height:46%;fill:none;stroke:rgba(255,255,255,.42);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(1px 1px 0 rgba(60,10,110,.45)) drop-shadow(-.5px -.5px 0 rgba(255,255,255,.35))}
.card .meta{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;line-height:1.1;text-shadow:0 1px 2px rgba(50,0,90,.35)}
.meta small{font-size:9px;font-weight:900;letter-spacing:.12em;opacity:.85}
.meta b{font-family:var(--f-num);font-size:clamp(20px,2.2vw,25px);font-weight:800;letter-spacing:-.02em;margin-top:2px}
.meta i{font-style:normal;font-size:9px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rare-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc,transparent)}
.r-common{--rc:transparent}.r-rare{--rc:var(--r-rare)}.r-epic{--rc:#f9a8f4}.r-legend{--rc:var(--r-legend)}

/* Mythic holo — purple base with iridescent sheen */
.r-mythic .card{background:linear-gradient(115deg,#A855F7 0%,#e9a8ff 18%,#a5e9ff 34%,#A855F7 50%,#ffd6f6 66%,#c4b5fd 82%,#A855F7 100%);background-size:220% 100%;animation:holo 4s linear infinite;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 34px rgba(168,85,247,.75),0 10px 24px rgba(0,0,0,.45)}
.r-mythic .card .ico{stroke:rgba(255,255,255,.7);filter:drop-shadow(0 0 3px rgba(255,255,255,.6))}
@keyframes holo{to{background-position:220% 0}}

.item.focus .card{transform:scale(1.06)}
.item.won .card{transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 0 40px var(--glow,rgba(255,255,255,.4)),0 12px 30px rgba(0,0,0,.5)}
.item.won .card::after{animation:sheen 1.1s ease .1s 2}
.r-common{--glow:rgba(220,230,230,.45)}.r-rare{--glow:rgba(95,182,255,.7)}.r-epic{--glow:rgba(184,139,255,.75)}.r-legend{--glow:rgba(255,197,77,.8)}.r-mythic{--glow:rgba(168,85,247,.95)}
@keyframes sheen{to{transform:translateX(120%)}}

.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.spin{font:inherit;font-size:18px;font-weight:900;letter-spacing:.2em;color:var(--lime-ink);background:var(--lime);border:0;border-radius:999px;padding:13px 46px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 30px rgba(200,245,106,.25)}
.spin:hover{filter:brightness(1.06)}
.spin:active{transform:translateY(1px)}
.spin:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:10px 18px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.hintline{color:var(--dim);font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Lower panels */
.lower{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.lower{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.03)}
td input,td select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 7px;width:100%}
td input[type=number]{width:64px;font-variant-numeric:tabular-nums}
td.pct{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc2);margin-right:6px}
.del{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;border-radius:6px;padding:0 6px}
.del:hover{color:#ff7b8a}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.h{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.02)}
.h .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;width:34px}
.h .t{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:14px;margin:0}
.c-common{--rc2:var(--r-common)}.c-rare{--rc2:var(--r-rare)}.c-epic{--rc2:var(--r-epic)}.c-legend{--rc2:var(--r-legend)}.c-mythic{--rc2:var(--r-mythic)}


/* Prize showcase */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{background:var(--line2);color:var(--fg)}
.show-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{--cw:92px;--ch:122px;--gap:0px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.tile .p{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.tile .item{gap:10px;flex:none}
.tile .item .label{width:100%;max-width:130px;font-size:13px}
.tile .card .meta b{font-size:20px}
/* Collapsible settings */
details.panel>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:700}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .chev{display:inline-block;margin-right:8px;color:var(--muted);transition:transform .2s}
details.panel[open]>summary .chev{transform:rotate(90deg)}
details.panel>summary small{color:var(--muted);font-weight:400;font-size:12px}
details.panel:not([open]){gap:0}

/* Result modal */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,4,20,.75);backdrop-filter:blur(6px)}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:28px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;width:min(380px,100%);text-align:center;animation:rise .45s cubic-bezier(.2,1.4,.4,1)}
.sheet .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.sheet h3{margin:0;font-size:24px;font-weight:900}
.sheet .rar{font-size:13px;font-weight:700;color:var(--rc2)}
.big{--cw:150px;--ch:200px}
.big .item{gap:0}
.big .item .label{display:none}
.big .card{transform:none}
@keyframes rise{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){.r-mythic .card{animation:none}.sheet{animation:none}.item.won .card::after{animation:none}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ticket" viewBox="0 0 64 48"><path d="M6 10h52v8a6 6 0 0 0 0 12v8H6v-8a6 6 0 0 0 0-12z"/><path d="M24 32l16-16"/><circle cx="25" cy="17" r="3"/><circle cx="39" cy="31" r="3"/></symbol>
  <symbol id="i-key" viewBox="0 0 64 48"><circle cx="16" cy="24" r="9"/><circle cx="16" cy="24" r="3"/><path d="M25 24h32M49 24v8M42 24v6"/></symbol>

  <symbol id="i-bolt" viewBox="0 0 64 48"><path d="M36 4L18 28h14l-4 16 18-24H32z"/></symbol>

</svg>

<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="gem"></span><h1>幸运大抽奖</h1></div>
    <div class="pills">
      <span class="pill" id="countPill">已抽 0 次</span>
      <button class="pill" id="soundBtn" aria-pressed="true">音效 开</button>
    </div>
  </div>

  <section class="stage">
    <div class="reel" id="reel">
      <div class="ptr t"></div><div class="ptr-line"></div><div class="ptr b"></div>
      <div class="track" id="track"></div>
    </div>
    <div class="actions">
      <button class="spin" id="spin">开始抽奖</button>
      <button class="ghost" id="skip" disabled>跳过动画</button>
    </div>
    <span class="hintline">按空格键也能开始 · 结果由加密随机数按权重决定</span>
  </section>

  <div class="lower">
    <div class="panel">
      <div class="show-head">
        <h2 style="margin:0">奖品一览</h2>
        <small style="color:var(--muted);font-size:12px" id="showCount"></small>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="panel">
      <h2>抽奖记录 <small id="histCount"></small></h2>
      <div class="hist" id="hist"></div>
      <div class="row-actions"><button class="ghost" id="clearHist">清空记录</button><span id="clearConfirm"></span></div>
    </div>
  </div>

  <details class="panel" id="poolPanel">
    <summary><span><span class="chev">▸</span>奖池设置</span><small id="poolSum"></small></summary>
    <div class="tbl-wrap" style="margin-top:12px">
      <table>
        <thead><tr><th>奖品名称</th><th>类别</th><th>大字</th><th>小字</th><th>图标</th><th>稀有度</th><th>权重</th><th style="text-align:right">概率</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row-actions" style="margin-top:12px">
      <button class="ghost" id="add">＋ 添加奖品</button>
      <button class="ghost" id="restore">恢复示例奖池</button>
    </div>

</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <span class="eyebrow">恭喜获得</span>
    <div class="big" id="mCard"></div>
    <h3 id="mTitle"></h3>
    <span class="rar" id="mRar"></span>
    <div class="actions"><button class="spin" id="again">再抽一次</button><button class="ghost" id="close">收下</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const RAR={common:"普通",rare:"稀有",epic:"史诗",legend:"传说",mythic:"神话"};
const ICONS={ticket:"折扣券",key:"钥匙",chart:"图表",bolt:"闪电",gift:"礼盒",coin:"金币",crown:"皇冠",star:"星芒",heart:"爱心"};
/* Weights = screenshot percentages × 10^7, in the same order (7.9e-7% → 7.9 … 0.00012% → 1200) */
const SAMPLE=[
  {name:"Free 25000 USDT X Mode",cat:"X MODE",big:"25K",sub:"USDT",icon:"chart",rar:"mythic",w:7.9},
  {name:"Free 5000 USDT X Mode",cat:"X MODE",big:"5K",sub:"USDT",icon:"chart",rar:"mythic",w:7.9},
  {name:"Free 2500 USDT X Mode",cat:"X MODE",big:"2.5K",sub:"USDT",icon:"chart",rar:"mythic",w:7.9},
  {name:"Free 25k USDT Y Mode",cat:"Y MODE",big:"25K",sub:"USDT",icon:"chart",rar:"mythic",w:8.5},
  {name:"Free 5k USDT Y Mode",cat:"Y MODE",big:"5K",sub:"USDT",icon:"chart",rar:"mythic",w:8.6},
  {name:"Free 2k USDT Y Mode",cat:"Y MODE",big:"2K",sub:"USDT",icon:"chart",rar:"mythic",w:9.1},
  {name:"Free 50k USDT Z Mode",cat:"Z MODE",big:"50K",sub:"USDT",icon:"crown",rar:"legend",w:150},
  {name:"Free 25k USDT Z Mode",cat:"Z MODE",big:"25K",sub:"USDT",icon:"crown",rar:"legend",w:150},
  {name:"Free 5k USDT Z Mode",cat:"Z MODE",big:"5K",sub:"USDT",icon:"crown",rar:"legend",w:180},
  {name:"Free 50% OFF",cat:"DISCOUNT",big:"50%",sub:"OFF",icon:"ticket",rar:"epic",w:200},
  {name:"Free 30% OFF",cat:"DISCOUNT",big:"30%",sub:"OFF",icon:"ticket",rar:"epic",w:230},
  {name:"Free 20% OFF",cat:"DISCOUNT",big:"20%",sub:"OFF",icon:"ticket",rar:"rare",w:240},
  {name:"Free 10% OFF",cat:"DISCOUNT",big:"10%",sub:"OFF",icon:"ticket",rar:"rare",w:330},
  {name:"300 XYZT",cat:"XYZT",big:"300",sub:"Token",icon:"coin",rar:"epic",w:360},
  {name:"100 XYZT",cat:"XYZT",big:"100",sub:"Token",icon:"coin",rar:"rare",w:600},
  {name:"50 XYZT",cat:"XYZT",big:"50",sub:"Token",icon:"coin",rar:"common",w:800},
  {name:"10 XYZT",cat:"XYZT",big:"10",sub:"Token",icon:"coin",rar:"common",w:970},
  {name:"5 XYZT",cat:"XYZT",big:"5",sub:"Token",icon:"coin",rar:"common",w:1200}
];
let st={prizes:SAMPLE.map(p=>({...p})),hist:[],sound:true};
try{const s=JSON.parse(localStorage.getItem("lucky-reel-v2")||"null");if(s&&Array.isArray(s.prizes)&&s.prizes.length)st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem("lucky-reel-v2",JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;};
const total=()=>st.prizes.reduce((s,p)=>s+Math.max(0,+p.w||0),0);
function pick(pow=1){const ws=st.prizes.map(p=>Math.pow(Math.max(0,+p.w||0),pow));const t=ws.reduce((a,b)=>a+b,0);if(t<=0)return null;let r=rnd()*t;for(let i=0;i<ws.length;i++){if((r-=ws[i])<0)return i;}return ws.length-1;}

function itemHTML(p){
  return `<div class="item r-${p.rar}"><div class="card"><span class="tint"></span><span class="mark"></span><svg class="ico"><use href="#i-${p.icon}"/></svg><div class="meta"><small>${esc(p.cat)}</small><b>${esc(p.big)}</b><i>${esc(p.sub)}</i></div><span class="rare-bar"></span></div><div class="label">${esc(p.name)}</div></div>`;
}

/* ---------- Reel ---------- */
const reel=$("#reel"),track=$("#track");
let seq=[],x=0,W=0,IW=0,focusIdx=-1,spinning=false,anim=null,lastIdx=null;
const START=4,TARGET=58,N=66;
function build(list){seq=list;track.innerHTML=list.map(i=>itemHTML(st.prizes[i])).join("");measure();}
function measure(){const a=track.children[0],b=track.children[1];if(!a||!b)return;IW=a.offsetWidth;W=b.offsetLeft-a.offsetLeft;}
const centerX=i=>reel.clientWidth/2-(i*W+IW/2);
function setX(v){x=v;track.style.transform=`translate3d(${v}px,0,0)`;const idx=Math.round((reel.clientWidth/2-v-IW/2)/W);
  if(idx!==focusIdx){const kids=track.children;if(kids[focusIdx])kids[focusIdx].classList.remove("focus");if(kids[idx])kids[idx].classList.add("focus");if(spinning&&focusIdx>=0)tick();focusIdx=idx;}}
function filler(n){const out=[];for(let i=0;i<n;i++)out.push(pick(.55));return out;}
function idle(){if(!st.prizes.length){track.innerHTML="";return;}const list=filler(30);if(lastIdx!=null&&lastIdx<st.prizes.length)list[12]=lastIdx;focusIdx=-1;build(list);setX(centerX(12));}

function spin(){
  if(spinning)return;
  const win=pick(1);if(win==null)return toast("请先给至少一个奖品设置大于 0 的权重");
  ensureAudio();
  const list=filler(N);list[START]=lastIdx!=null&&lastIdx<st.prizes.length?lastIdx:list[START];list[TARGET]=win;
  focusIdx=-1;build(list);setX(centerX(START));
  spinning=true;$("#spin").disabled=true;$("#skip").disabled=false;lock(true);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const D=reduce?1200:6800;const from=x;const to=centerX(TARGET)+(rnd()-.5)*IW*.86;
  const t0=performance.now();
  const ease=t=>1-Math.pow(1-t,4.2);
  const step=now=>{const t=Math.min(1,(now-t0)/D);setX(from+(to-from)*ease(t));
    if(t<1)anim=requestAnimationFrame(step);else settle(win);};
  anim=requestAnimationFrame(step);
}
function settle(win){
  const from=x,to=centerX(TARGET),t0=performance.now(),D=380;
  const step=now=>{const t=Math.min(1,(now-t0)/D);const e=1-Math.pow(1-t,3);setX(from+(to-from)*e);if(t<1)anim=requestAnimationFrame(step);else land(win);};
  anim=requestAnimationFrame(step);
}
function skip(){if(!spinning)return;cancelAnimationFrame(anim);const win=seq[TARGET];spinning=false;setX(centerX(TARGET));land(win);}
function land(win){
  spinning=false;lastIdx=win;$("#skip").disabled=true;
  const el=track.children[TARGET];el.classList.add("won");
  const p=st.prizes[win];
  st.hist.unshift({name:p.name,rar:p.rar,t:Date.now()});st.hist=st.hist.slice(0,200);save();renderHist();
  winSound(p.rar);
  setTimeout(()=>{showModal(p);burst(p.rar);$("#spin").disabled=false;lock(false);},650);
}
function lock(on){document.querySelectorAll("#rows input,#rows select,#rows button,#add,#restore,#clearHist").forEach(e=>e.disabled=on);}

/* ---------- Modal ---------- */
function showModal(p){
  $("#mCard").innerHTML=itemHTML(p);$("#mTitle").textContent=p.name;
  const r=$("#mRar");r.textContent=RAR[p.rar]+"品质";r.className="rar c-"+p.rar;
  $("#modal").hidden=false;$("#again").focus();
}
function hideModal(){$("#modal").hidden=true;}
$("#close").onclick=hideModal;
$("#again").onclick=()=>{hideModal();spin();};
$("#modal").onclick=e=>{if(e.target.id==="modal")hideModal();};


/* ---------- Showcase ---------- */
const ORDER=["mythic","legend","epic","rare","common"];
let tab="all";
function pctStr(v){if(v<=0)return"0%";if(v>=1)return v.toFixed(2).replace(/\.?0+$/,"")+"%";const d=Math.max(2,1-Math.floor(Math.log10(v)));return v.toFixed(d).replace(/0+$/,"")+"%";}
function renderShow(){
  const t=total();
  const counts={};st.prizes.forEach(p=>counts[p.rar]=(counts[p.rar]||0)+1);
  const keys=["all",...ORDER.filter(k=>counts[k])];if(!keys.includes(tab))tab="all";
  $("#tabs").innerHTML=keys.map(k=>`<button class="tab" role="tab" data-k="${k}" aria-selected="${k===tab}">${k==="all"?"全部":RAR[k]}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.k;renderShow();});
  const list=st.prizes.map((p,i)=>({p,i})).filter(o=>tab==="all"||o.p.rar===tab)
    .sort((a,b)=>ORDER.indexOf(a.p.rar)-ORDER.indexOf(b.p.rar)||(+a.p.w||0)-(+b.p.w||0));
  $("#showCount").textContent=`${list.length} 件奖品`;
  $("#grid").innerHTML=list.map(({p})=>{const v=t>0?Math.max(0,+p.w||0)/t*100:0;return `<div class="tile"><span class="p">${pctStr(v)}</span>${itemHTML(p)}</div>`;}).join("");
}

/* ---------- Editor ---------- */
function renderRows(){
  const t=total();const tb=$("#rows");tb.innerHTML="";
  st.prizes.forEach((p,i)=>{
    const tr=document.createElement("tr");tr.className="c-"+p.rar;
    const pct=t>0?(Math.max(0,+p.w||0)/t*100):0;
    tr.innerHTML=`<td><input id="n${i}" aria-label="奖品名称"></td><td><input id="c${i}" aria-label="类别" style="width:72px"></td><td><input id="b${i}" aria-label="大字" style="width:70px"></td><td><input id="s${i}" aria-label="小字"></td>
      <td><select id="ic${i}" aria-label="图标">${Object.entries(ICONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></td>
      <td><select id="r${i}" aria-label="稀有度">${Object.entries(RAR).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></td>
      <td><input type="number" min="0" step="1" id="w${i}" aria-label="权重"></td>
      <td class="pct"><span class="dot"></span><span id="pc${i}">${pct.toFixed(pct<1?2:1)}%</span></td><td><button class="del" title="删除" aria-label="删除这个奖品">×</button></td>`;
    tb.appendChild(tr);
    const bind=(id,key,num)=>{const el=tr.querySelector("#"+id+i);el.value=p[key];el.oninput=el.onchange=()=>{p[key]=num?Math.max(0,parseFloat(el.value)||0):el.value;if(key==="rar")tr.className="c-"+p.rar;save();edited(key==="w");};};
    bind("n","name");bind("c","cat");bind("b","big");bind("s","sub");bind("ic","icon");bind("r","rar");bind("w","w",true);
    tr.querySelector(".del").onclick=()=>{if(st.prizes.length<=1)return toast("奖池里至少要有一个奖品");st.prizes.splice(i,1);lastIdx=null;save();renderRows();idle();};
  });
  $("#poolSum").textContent=`${st.prizes.length} 种奖品 · 总权重 ${+t.toFixed(2)}`;
  renderShow();
}
let et;function edited(w){if(w){const t=total();st.prizes.forEach((p,i)=>{const pct=t>0?(Math.max(0,+p.w||0)/t*100):0;const el=$("#pc"+i);if(el)el.textContent=pct.toFixed(pct<1?2:1)+"%";});$("#poolSum").textContent=`${st.prizes.length} 种奖品 · 总权重 ${+t.toFixed(2)}`;}
  clearTimeout(et);et=setTimeout(()=>{idle();renderShow();},350);}
$("#add").onclick=()=>{st.prizes.push({name:"新奖品",cat:"奖品",big:"1x",sub:"",icon:"gift",rar:"common",w:10});save();renderRows();idle();const i=st.prizes.length-1;$("#n"+i).focus();$("#n"+i).select();};
$("#restore").onclick=()=>{st.prizes=SAMPLE.map(p=>({...p}));lastIdx=null;save();renderRows();idle();toast("已恢复示例奖池");};

/* ---------- History ---------- */
function renderHist(){
  const h=$("#hist");$("#countPill").textContent=`已抽 ${st.hist.length} 次`;$("#histCount").textContent=st.hist.length?`共 ${st.hist.length} 条`:"";
  if(!st.hist.length){h.innerHTML='<p class="empty">还没有抽奖记录。转一次试试，结果会显示在这里。</p>';return;}
  h.innerHTML=st.hist.map((r,i)=>{const d=new Date(r.t);const tm=d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    return `<div class="h c-${r.rar}"><span class="n">#${st.hist.length-i}</span><span class="dot"></span><span>${esc(r.name)}</span><span class="t">${tm}</span></div>`}).join("");
}
$("#clearHist").onclick=()=>{if(!st.hist.length)return toast("目前没有记录");
  const c=$("#clearConfirm");c.innerHTML='<button class="ghost" id="yes">确定清空</button> <button class="ghost" id="no">取消</button>';
  $("#yes").onclick=()=>{st.hist=[];save();renderHist();c.innerHTML="";toast("记录已清空");};$("#no").onclick=()=>c.innerHTML="";};

/* ---------- Sound ---------- */
let ac=null;
function ensureAudio(){if(!st.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){ac=null;}}
function blip(freq,dur,type="square",vol=.05,when=0){if(!ac||!st.sound)return;const t=ac.currentTime+when;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);}
function tick(){blip(1500+rnd()*200,.025,"square",.03);}
function winSound(r){const lv={common:1,rare:2,epic:3,legend:4,mythic:5}[r]||1;const notes=[523,659,784,1047,1319,1568];for(let i=0;i<Math.min(6,2+lv);i++)blip(notes[i],.22,"triangle",.07,i*.09);}
function syncSound(){const b=$("#soundBtn");b.textContent=st.sound?"音效 开":"音效 关";b.setAttribute("aria-pressed",st.sound);}
$("#soundBtn").onclick=()=>{st.sound=!st.sound;save();syncSound();if(st.sound)ensureAudio();};

/* ---------- Confetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function burst(rar){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const n={common:40,rare:70,epic:110,legend:160,mythic:240}[rar]||50;
  const cs=getComputedStyle(document.documentElement);
  const base=cs.getPropertyValue("--r-"+rar).trim();const cols=[base,"#ffffff",cs.getPropertyValue("--lime").trim()];
  const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const ox=cv.width/2,oy=cv.height*.42;
  for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=(3+rnd()*10)*dpr;parts.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5*dpr,w:(4+rnd()*6)*dpr,h:(2+rnd()*4)*dpr,r:rnd()*6,vr:(rnd()-.5)*.4,c:cols[i%3],life:110+rnd()*70,dpr});}
  if(!raf)loop();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+40);
  for(const p of parts){p.vy+=.22*p.dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();}
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),0);}

/* ---------- Wiring ---------- */
let tt;function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f1ecf8;color:#120922;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:50";document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1900);}
$("#spin").onclick=spin;
$("#skip").onclick=skip;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#modal").hidden)return hideModal();
  if(e.code!=="Space")return;const tg=e.target.tagName;if(["INPUT","SELECT","TEXTAREA","BUTTON"].includes(tg))return;
  e.preventDefault();if(!$("#modal").hidden){hideModal();spin();return;}if(spinning)skip();else spin();});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(spinning)return;measure();setX(centerX(Math.max(0,focusIdx)));},120);});
syncSound();renderRows();renderShow();renderHist();idle();
document.fonts&&document.fonts.ready.then(()=>{if(!spinning){measure();setX(centerX(Math.max(0,focusIdx)));}});
</script>

</body>
